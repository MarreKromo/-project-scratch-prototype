
name: Statistics tests

on:
  push:
    branches:
      - af-07-statistics-engine-tests
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: npm test
      - name: Build app
        run: npm run build
